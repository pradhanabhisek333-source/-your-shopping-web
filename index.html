
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Marketplace</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#222}
header{background:#173b70;color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 10px #ddd}
input,select,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#1769aa;color:white;border:0;cursor:pointer}
button:hover{background:#104d80}
.product{border:1px solid #ddd;padding:15px;margin:12px 0;border-radius:10px}
.product img{width:100%;max-height:220px;object-fit:contain}
.small{color:#666;font-size:13px}
.hidden{display:none}
</style>
</head>

<body>
<header>
<h1>Campus Marketplace</h1>
<p>Buy • Sell • Rent • Connect</p>
</header>

<div class="container">

<section class="card" id="loginBox">
<h2>Login / Register</h2>
<p>Enter your Indian mobile number.</p>

<input id="phone" placeholder="+91XXXXXXXXXX">
<select id="role">
<option value="buyer">Buyer</option>
<option value="seller">Seller</option>
</select>

<div id="recaptcha-container"></div>
<button id="sendOtp">Send OTP</button>

<input id="otp" placeholder="Enter OTP">
<button id="verifyOtp">Verify OTP</button>
<p id="loginMessage" class="small"></p>
</section>

<section class="card hidden" id="dashboard">
<h2>Welcome to Campus Marketplace!</h2>
<p id="userInfo"></p>
<button id="logout">Logout</button>
</section>

<section class="card hidden" id="sellerBox">
<h2>Sell a Product</h2>
<input id="productName" placeholder="Product name">
<input id="productPrice" type="number" placeholder="Price in ₹">
<select id="productType">
<option value="Buy">For Sale</option>
<option value="Rent">For Rent</option>
</select>
<input id="productImage" placeholder="Image URL (optional)">
<textarea id="productDescription" placeholder="Product description"
style="width:100%;height:90px;padding:10px"></textarea>
<button id="addProduct">Publish Product</button>
<p id="sellerMessage" class="small"></p>
</section>

<section class="card hidden" id="marketBox">
<h2>Available Products</h2>
<div id="products">Loading products...</div>
</section>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore, doc, setDoc, addDoc, collection,
onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

// REPLACE THESE VALUES with your saved Firebase configuration.
const firebaseConfig = {
  apiKey:"AIzaSyDQk5xe28AujBZMXnCu_KbY-TVHRktvsGI",
  authDomain:  "campus-marketplace-fd855.firebaseapp.com",
  projectId: "campus-marketplace-fd855",
  storageBucket: "campus-marketplace-fd855.firebasestorage.app",
  messagingSenderId:  "1012988673137",
  appId:  "1:1012988673137:web:7a3c4d2bc20eb898562fd0",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let confirmationResult = null;
let selectedRole = "buyer";
let currentUser = null;
let recaptcha = null;

const $ = id => document.getElementById(id);

function showMessage(id, message) {
  $(id).textContent = message;
}

function setupRecaptcha() {
  if (recaptcha) return;
  recaptcha = new RecaptchaVerifier(auth, "recaptcha-container", {});
  recaptcha.render();
}

$("sendOtp").addEventListener("click", async () => {
  const phone = $("phone").value.trim();
  selectedRole = $("role").value;

  if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
    showMessage("loginMessage", "Enter number with country code, e.g. +91XXXXXXXXXX");
    return;
  }

  try {
    setupRecaptcha();
    confirmationResult = await signInWithPhoneNumber(auth, phone, recaptcha);
    showMessage("loginMessage", "OTP sent! Check your phone.");
  } catch (error) {
    showMessage("loginMessage", error.message);
  }
});

$("verifyOtp").addEventListener("click", async () => {
  if (!confirmationResult) {
    showMessage("loginMessage", "Please request an OTP first.");
    return;
  }

  try {
    const result = await confirmationResult.confirm($("otp").value.trim());
    currentUser = result.user;

    await setDoc(doc(db, "users", currentUser.uid), {
      phone: currentUser.phoneNumber,
      role: selectedRole,
      updatedAt: serverTimestamp()
    }, { merge: true });

    showDashboard();
  } catch (error) {
    showMessage("loginMessage", "OTP verification failed: " + error.message);
  }
});

function showDashboard() {
  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("marketBox").classList.remove("hidden");
  $("userInfo").textContent =
    "Mobile: " + currentUser.phoneNumber + " | Role: " + selectedRole;

  if (selectedRole === "seller") {
    $("sellerBox").classList.remove("hidden");
  } else {
    $("sellerBox").classList.add("hidden");
  }
}

$("addProduct").addEventListener("click", async () => {
  const name = $("productName").value.trim();
  const price = Number($("productPrice").value);
  const description = $("productDescription").value.trim();

  if (!name || !Number.isFinite(price) || price <= 0) {
    showMessage("sellerMessage", "Enter a product name and valid price.");
    return;
  }

  try {
    await addDoc(collection(db, "products"), {
      name,
      price,
      type: $("productType").value,
      imageUrl: $("productImage").value.trim(),
      description,
      sellerId: currentUser.uid,
      sellerPhone: currentUser.phoneNumber,
      createdAt: serverTimestamp(),
      isActive: true
    });

    showMessage("sellerMessage", "Product published successfully!");
    $("productName").value = "";
    $("productPrice").value = "";
    $("productImage").value = "";
    $("productDescription").value = "";
  } catch (error) {
    showMessage("sellerMessage", error.message);
  }
});

onSnapshot(collection(db, "products"), snapshot => {
  const area = $("products");
  area.innerHTML = "";

  if (snapshot.empty) {
    area.textContent = "No products listed yet.";
    return;
  }

  snapshot.forEach(productDoc => {
    const p = productDoc.data();
    if (p.isActive === false) return;

    const item = document.createElement("div");
    item.className = "product";

    const title = document.createElement("h3");
    title.textContent = p.name || "Product";

    const price = document.createElement("p");
    price.textContent = "₹" + (p.price ?? "Ask seller") + " • " + (p.type || "Sale");

    const description = document.createElement("p");
    description.textContent = p.description || "";

    item.append(title, price, description);

    if (p.imageUrl) {
      const img = document.createElement("img");
      img.src = p.imageUrl;
      img.alt = p.name || "Product image";
      item.prepend(img);
    }

    if (p.sellerPhone) {
      const contact = document.createElement("a");
      contact.href = "https://wa.me/" + p.sellerPhone.replace(/\D/g, "");
      contact.target = "_blank";
      contact.rel = "noopener";
      contact.textContent = "Contact seller on WhatsApp";
      item.append(contact);
    }

    area.append(item);
  });
}, error => {
  $("products").textContent = "Could not load products: " + error.message;
});

$("logout").addEventListener("click", async () => {
  await signOut(auth);
  location.reload();
});
</script>
</body>
</html>
